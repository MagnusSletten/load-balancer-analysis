services:
  app1:
    build: ./app
    expose: ["8000"]
    ports: ["8001:8000"]
    environment:
      - GUNICORN_WORKERS=1
      - NAME="app_1"
 #     - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app2:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
      -  NAME="app_2"
  #    - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app3:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
      -  NAME="app_3"
   #   - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app4:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
      -  NAME="app_4"
    #  - JOB_FACTOR=0.0001      
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app5:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
      -  NAME="app_5"
    #  - JOB_FACTOR=0.0001
    deploy:
      resources:
        limits:
          cpus: "0.50"

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app1, app2, app3, app4, app5]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:8082"  # nginx random
      - "8083:8083"  # nginx least-connections

  caddy:
    image: caddy:2
    depends_on: [app1, app2, app3, app4, app5]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "9082:8082"  
      - "9083:8083"  

  traefik:
    image: traefik:v3.6.2
    depends_on: [app1, app2, app3, app4, app5]
    command:
      - "--log.level=DEBUG" 
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8082"
      - "--entrypoints.web2.address=:8083"
      - "--accesslog=true" 
    ports:
      - "10082:8082"  # Traefik entrypoint 1 (e.g. RR/random)
      - "10083:8083"  # Traefik entrypoint 2 (e.g. least-time)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  sender:
    build: ./sender
    depends_on: [traefik, nginx, caddy]
    environment:
   #    - TARGET_RR_NGINX=http://nginx:8082/calculate
      - TARGET_LC_NGINX=http://nginx:8083/calculate

      # CADDY
 #     - TARGET_RR_CADDY=http://caddy:9082/calculate
 #     - TARGET_LC_CADDY=http://caddy:9083/calculate

      # TRAEFIK
      - TARGET_LT_TRAEFIK=http://traefik:8082/calculate
    #  - TARGET_LC_TRAEFIK=http://traefik:8083/calculate

      - DURATION_SEC=300
      - CAPTURE_UPSTREAM=1
      - JOB_MODE=cycle
      - JOBS=A,B,C
      - JOB_WEIGHTS=C:6,E:3,A:1
      - REQUEST_TIMEOUT_SEC=120
      - CONCURRENCY=5
      - TARGET_RPS=0
      - JOB_FACTOR=0.0001
      - RUN_STREAM=0
      - RUN_BATCH=1
      - BATCH_COUNT=5
      - BATCH_REQUESTS=50
      - START_DELAY_SEC=12
      - COOLDOWN_SEC=15
