services:
  app1:
    build: ./app
    expose: ["8000"]
    ports: ["8001:8000"]
    environment:
      - GUNICORN_WORKERS=1
 #     - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app2:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
  #    - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app3:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
   #   - JOB_FACTOR=0.0001 
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app4:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
    #  - JOB_FACTOR=0.0001      
    deploy:
      resources:
        limits:
          cpus: "0.50"

  app5:
    build: ./app
    expose: ["8000"]
    environment:
      - GUNICORN_WORKERS=1
    #  - JOB_FACTOR=0.0001
    deploy:
      resources:
        limits:
          cpus: "0.50"

#  nginx:
 #   image: nginx:1.27-alpine
 #   depends_on: [app1, app2, app3, app4, app5]
 #   volumes:
  #    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #3  ports:
  #    - "8082:8082"  # nginx round-robin
  #    - "8083:8083"  # nginx least-connections

  # Caddy: RR on 9082, LC on 9083 (host ports)
  #caddy:
  #  image: caddy:2
  #  depends_on: [app1, app2, app3, app4, app5]
  #  volumes:
  #    - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
   # ports:
   #   - "9082:8082"  # caddy random / RR
   #   - "9083:8083"  # caddy LC (or second policy)

  # Traefik: two entrypoints (8082, 8083) mapped to different host ports
  traefik:
    image: traefik
    depends_on: [app1, app2, app3, app4, app5]
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8082"
      - "--entrypoints.web2.address=:8083"
      - "--log.level=INFO"
    ports:
      - "10082:8082"  # Traefik entrypoint 1 (e.g. RR/random)
      - "10083:8083"  # Traefik entrypoint 2 (e.g. least-time)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  sender:
    build: ./sender
    depends_on: [traefik]
    environment:
      # right now sender still targets Traefik inside the Docker network
  #    - TARGET_RR_NGINX=http://nginx:8082/calculate
  #    - TARGET_LC_NGINX=http://nginx:8083/calculate

      # CADDY
 #     - TARGET_RR_CADDY=http://caddy:9082/calculate
 #     - TARGET_LC_CADDY=http://caddy:9083/calculate

      # TRAEFIK
      - TARGET_RR_TRAEFIK=http://traefik:8082/calculate
      - TARGET_LC_TRAEFIK=http://traefik:8083/calculate

      # You can add more envs if you want to hit nginx/caddy instead:
     #  - TARGET_NGINX_RR=http://nginx:8082/calculate
     #  - TARGET_NGINX_LC=http://nginx:8083/calculate
      # - TARGET_CADDY_RR=http://caddy:8082/calculate
      # - TARGET_CADDY_LC=http://caddy:8083/calculate

      - DURATION_SEC=60
      - JOB_MODE=cycle
      - JOBS=A,B,C
      - JOB_WEIGHTS=C:6,E:3,A:1
      - REQUEST_TIMEOUT_SEC=120
      - CONCURRENCY=5
      - TARGET_RPS=0
      - JOB_FACTOR=0.0001
      - RUN_STREAM=1
      - RUN_BATCH=1
      - BATCH_COUNT=10
      - BATCH_REQUESTS=50
      - START_DELAY_SEC=12
      - COOLDOWN_SEC=15
